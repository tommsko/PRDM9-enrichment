# Analysis environment for the PRDM9 pipeline (notebook stages + workflow + unit tests).
# Versions are pinned to what produced the manuscript results: the cluster's conda base image
# (data_sources/conda_export.txt) plus the pip packages the notebooks installed (pip logs inside the
# notebooks). Create with:  python prdm9.py setup   (or: mamba env create -p .envs/prdm9 -f envs/prdm9.yml)
name: prdm9
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11.6
  - numpy=1.24.4
  - pandas=2.1.1
  - scipy=1.11.3
  - matplotlib=3.8.0
  - seaborn=0.13.0
  - statsmodels=0.14.0
  - scikit-learn=1.3.1
  - joblib=1.3.2
  - numba=0.57.1
  - pyarrow=13.0.0
  - tqdm=4.66.1
  - pyyaml=6.0.1
  - snakemake-minimal=8.25.5 # workflow engine
  - pytest=8.3.3             # unit tests (tests/)
  - pyflakes=3.2.0           # static check of the converted stages (tests/test_static.py)
  - pip=24.2
  - pip:
      - pyranges==0.1.4
      - ncls==0.0.70
      - sorted_nearest==0.0.41
      - natsort==8.4.0
      - tabulate==0.9.0
      - pyfaidx==0.9.0.4
      - pysam==0.23.3
      - pyBigWig==0.3.25
      - rich==15.0.0
