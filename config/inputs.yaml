# Input data manifest. `python prdm9.py fetch` materialises every entry under data/ (config data_dir).
# Every input is the exact file used for the manuscript (md5-checked); nothing is re-derived with methods or
# settings that differ from the original work.
#
# kind:
#   download  fetched from `url` (optionally checking `url_md5` of the downloaded object), then `steps`
#             are applied in order: gunzip | strip_track (drop a leading UCSC "track" line) | head:N
#   derived   built by the named rule in workflow/rules/data.smk; only used where the result is byte-identical
#   provided  no public source for the exact file (authors' own derivation, steps not documented); fetched
#             from config `provided_inputs_url`/<file name> (or placed by hand) and checked against `md5`
# md5:     md5 of the file exactly as used; any mismatch is an error
#
# Provenance was traced on 2026-11-23/24: every `download` entry was matched byte-for-byte to the file used.

genome:
  hg38.fa:
    kind: download
    url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/initial/hg38.fa.gz
    url_md5: 1c9dcaddfa41027f17cd8f7a82c7293b
    steps: [gunzip]
    md5: b2aee9f885accc00531e59c4736bee63
    source: UCSC hg38 initial release (2014-01-15, 455 sequences; NOT bigZips/latest = p14)
  hg38.fa.fai:
    kind: derived
    rule: genome_index
    md5: 1954682fe412d4c5f8b93ad8e4083181
    recipe: samtools faidx (pysam.faidx) of hg38.fa

prdm9:
  prdm9_peaks/HEK293_PRDM9-B_HA_MACS2_hg38.bed:
