    md5: 6dc00b4021b540eb0d504f45d54b4021
    source: MACS2 peaks (Galaxy) on GEO GSE99407 HumanPRDM9_HA anti-HA vs input; authors' GitHub, pinned commit

g4:
  g4/pqsfinder_hg38.bed:
    kind: download
    url: https://pqsfinder.fi.muni.cz/hub/hg38/pqsfinder_hg38.bed
    md5: 6bc2d5dceec34a9b593dd751a417c73a
    source: pqsfinder v2.0.1 genome-wide hg38 track (file dated 2019-05-07), 1,352,359 PQSs, min score 52
  g4/HEK293_G4s_hg38.bed:
    kind: download
    url: https://raw.githubusercontent.com/angelikaLahn/PRDM9_G4_overlap/48750027e5b1609c7e6fe3a74fdfb78c521b4dab/datasets/ChIPseeker/HEK293_G4s_hg38.bed
    md5: 29655117b69960051bacb390c801c33c
    source: >-
      BG4 CUT&Tag consensus (>= 2 of 10 SEACR datasets, the authors' scripts/01_identify_shared_G4_peaks.sh),
      authors' GitHub, pinned commit
  g4/G4s_short_pqsfinder_hg38.txt:
    kind: provided
    md5: b1dc6251a23d80285027470b78711ee3
    source: >-
      pqsfinder hg38 motifs (with sequence) classified as canonical short-loop (1-3 nt) by the authors; G2-4 runs.
      The exact classification script is not public (the GitHub 05_canonical_G4_loop_lengths.R uses G3-4 and
      reproduces <15% of the file; G2-4 reproduces Short 99.5%, Medium/Long ~85%). Ask the authors for the script.
  g4/G4s_median_pqsfinder_hg38.txt:
    kind: provided
    md5: 7f5736526cf39a1babfd6e3520ab1118
    source: as above, medium loops (4-6 nt)
  g4/G4s_long_pqsfinder_hg38.txt:
    kind: provided
    md5: d2d5ab988620aaafd4fab61fc4dc4a6f
    source: as above, long loops (7-12 nt)

methylation:
