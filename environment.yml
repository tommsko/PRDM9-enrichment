# PRDM9 Analysis Environment
# Create with: mamba env create -f environment.yml
# Or: conda env create -f environment.yml

name: prdm9-analysis
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.11

  # Core scientific stack
  - numpy>=1.24
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.3

  # Genomics
  - pyranges>=0.0
  - pyfaidx>=0.7
  - pysam>=0.22
  - pybigwig>=0.3

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  # Parallelization & utilities
  - joblib>=1.3
  - tqdm>=4.66
  - rich>=13.0

  # Jupyter
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipywidgets>=8.0

  # Data formats
  - pyarrow>=14.0
  - fastparquet>=2023.0

  # Statistics
  - statsmodels>=0.14

  # Sequence analysis
  - biopython>=1.81

  # System
  - pip>=23.0
